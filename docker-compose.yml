# ─────────────────────────────────────────────────────────────────────────────
# BOTTEU — Docker Compose
#
# Services:
#   postgres  — PostgreSQL 16 (production DB)
#   redis     — SSE pub/sub (live bot logs) + rate-limiter storage
#   web       — Flask + Gunicorn (bot ticks + Binance collector run in-process
#               as background threads — see app/__init__.py)
#   nginx     — Reverse proxy / SSL termination
#   certbot   — Auto-renews TLS certs (renewal loop; see README for first-time
#               issuance, which is a separate one-off command)
#
# There is no separate Celery worker/beat or standalone collector container:
# everything runs inside the single `web` process, matching the Render deploy
# (render.yaml) so behavior doesn't drift between environments.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: botteu_db
      POSTGRES_USER: botteu_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strongpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botteu_user -d botteu_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────
  # Used for SSE pub/sub (live bot log streaming) and Flask-Limiter storage.
  # Without it, Flask-Limiter raises a hard ConnectionError on every request
  # if REDIS_URL points anywhere unreachable (it does not fall back to
  # in-memory storage on its own) — so this must always be reachable.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Flask / Gunicorn ────────────────────────────────────────────────────
  # IMPORTANT: --workers 1 is intentional (see gunicorn.conf.py).
  # The bot tick thread and the Binance collector thread both run inside the
  # Flask process. Multiple workers would each start their own copies →
  # duplicate bot ticks (double orders) and duplicate collector writers
  # (corrupted CSVs). Use --threads for concurrency instead.
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_ENV: production
      # +psycopg: requirements.txt installs psycopg3, not psycopg2 (no Python
      # 3.13 wheel for psycopg2-binary). A bare "postgresql://" URL makes
      # SQLAlchemy default to the psycopg2 dialect and fail with
      # ModuleNotFoundError at startup.
      DATABASE_URL: postgresql+psycopg://botteu_user:${POSTGRES_PASSWORD:-strongpassword}@postgres:5432/botteu_db
      # Overrides any REDIS_URL in .env — "redis" only resolves inside this
      # compose network, so the value must always point at the redis service.
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /app/collector_data
      COLLECTOR_SYMBOLS: ${COLLECTOR_SYMBOLS:-BTCUSDT}
      COLLECTOR_ROLL_WINDOW: ${COLLECTOR_ROLL_WINDOW:-7770}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - instance_data:/app/instance
      - static_data:/app/app/static
      - collector_data:/app/collector_data
    expose:
      - "5000"

  # ── Nginx reverse proxy ────────────────────────────────────────────────
  # Entrypoint wrapper generates a throwaway self-signed cert on first boot if
  # no real one exists yet, so nginx never crash-loops on a fresh deployment
  # before certbot has issued a real certificate (see docker-entrypoint-wrapper.sh).
  nginx:
    build: ./nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/var/www/static:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt
    depends_on:
      - web

  # ── Certbot (auto-renewal loop) ────────────────────────────────────────
  # First-time certificate issuance is a separate one-off command — see the
  # "First-time SSL" section in README. This service only renews existing certs.
  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'

volumes:
  postgres_data:
  instance_data:
  static_data:
  certbot_www:
  certbot_conf:
  collector_data:

